{% extends "base.html" %}
{% block title %}{{ notice.title }} - Cierra Energy{% endblock %}

{% block content %}
<div class="container py-3 py-md-5 my-md-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="mb-3">
                <a href="/notices" class="text-decoration-none text-secondary small">← 목록으로 돌아가기</a>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="badge bg-primary bg-opacity-10 text-primary px-3 py-2 rounded-pill fw-semibold">{{ notice.category }}</span>
                    <small class="text-muted">{{ notice.created_at[:10] }}</small>
                </div>
                <h2 class="fs-4 fs-md-2 fw-bold mb-4">{{ notice.title }}</h2>
                <hr class="text-muted mb-4">
                <div class="card-text text-secondary lh-lg" style="white-space: pre-wrap;">{{ notice.content }}</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
