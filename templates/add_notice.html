{% extends "base.html" %}
{% block title %}공지사항 작성 - Cierra Energy{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>새 공지/뉴스 등록</h2>
                <a href="/dashboard/admin" class="btn btn-outline-secondary btn-sm">← 대시보드로 돌아가기</a>
            </div>

            <div class="card border-0 shadow-sm rounded-4 p-4 bg-white">
                <div class="card-body">
                    <form action="/dashboard/admin/notices/add" method="POST">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label class="form-label fw-semibold">제목</label>
                                <input type="text" class="form-control form-control-lg fs-6" name="title" placeholder="제목을 입력하세요" required autofocus>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-semibold">카테고리</label>
                                <select class="form-select form-select-lg fs-6" name="category">
                                    <option value="공지사항" selected>공지사항</option>
                                    <option value="RE100 정책">RE100 정책</option>
                                    <option value="업계 소식">업계 소식</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold">본문 내용</label>
                            <textarea class="form-control" name="content" rows="8" placeholder="내용을 입력하세요..." required></textarea>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-dark btn-lg py-3 fw-semibold shadow-sm">등록하기</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
